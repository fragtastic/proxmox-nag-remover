name: Build and release Debian package

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and build .deb
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Debian packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            build-essential \
            debhelper \
            lintian

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tags must use stable SemVer format vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi

          package_version="$(dpkg-parsechangelog -S Version)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "$package_version" != "$tag_version" ]]; then
            echo "Tag version $tag_version does not match debian/changelog version $package_version" >&2
            exit 1
          fi

      # dpkg-buildpackage checks Build-Depends, and debhelper invokes the
      # Makefile's test target as part of the standard binary build sequence.
      - name: Build and test binary package
        run: make build

      - name: Collect and validate package
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          package_version="$(dpkg-parsechangelog -S Version)"
          deb_path="../proxmox-nag-remover_${package_version}_all.deb"
          changes_files=(../proxmox-nag-remover_"${package_version}"_*.changes)

          if [[ ! -f "$deb_path" || "${#changes_files[@]}" -ne 1 ]]; then
            echo "Expected package outputs were not produced" >&2
            exit 1
          fi
          changes_path="${changes_files[0]}"

          dpkg-deb --info "$deb_path"
          dpkg-deb --contents "$deb_path"
          lintian --fail-on error "$changes_path"

          mkdir -p artifacts
          cp "$deb_path" artifacts/
          (
            cd artifacts
            sha256sum ./*.deb > SHA256SUMS
          )

      # This artifact is only an internal handoff to the release job. Branch,
      # pull-request, and manual builds do not retain disposable artifacts.
      - name: Pass package to release job
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          name: proxmox-nag-remover-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download validated package
        uses: actions/download-artifact@v7
        with:
          name: proxmox-nag-remover-${{ github.sha }}
          path: artifacts

      - name: Publish release and assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --title "proxmox-nag-remover ${GITHUB_REF_NAME#v}" \
              --generate-notes
          fi

          gh release upload "$GITHUB_REF_NAME" \
            artifacts/*.deb \
            artifacts/SHA256SUMS \
            --clobber
