name: Build and release Debian package

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and build .deb
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Debian packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            build-essential \
            debhelper \
            lintian

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tags must use stable SemVer format vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi

          package_version="$(dpkg-parsechangelog -S Version)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "$package_version" != "$tag_version" ]]; then
            echo "Tag version $tag_version does not match debian/changelog version $package_version" >&2
            exit 1
          fi

      - name: Run tests
        run: make test

      - name: Check build dependencies
        run: dpkg-checkbuilddeps

      - name: Build binary package
        run: make build

      - name: Collect and validate package
        shell: bash
        run: |
          set -euo pipefail

          deb_path="$(find .. -maxdepth 1 -type f -name 'proxmox-nag-remover_*_all.deb' -print -quit)"
          if [[ -z "$deb_path" ]]; then
            echo "Expected Debian package was not produced" >&2
            exit 1
          fi

          dpkg-deb --info "$deb_path"
          dpkg-deb --contents "$deb_path"
          lintian --fail-on error "$deb_path"

          mkdir -p artifacts
          cp "$deb_path" artifacts/
          (
            cd artifacts
            sha256sum ./*.deb > SHA256SUMS
          )

      - name: Upload Debian package
        uses: actions/upload-artifact@v7
        with:
          name: proxmox-nag-remover-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download validated package
        uses: actions/download-artifact@v7
        with:
          name: proxmox-nag-remover-${{ github.sha }}
          path: artifacts

      - name: Publish release and assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            artifacts/*.deb \
            artifacts/SHA256SUMS \
            --verify-tag \
            --title "proxmox-nag-remover ${GITHUB_REF_NAME#v}" \
            --generate-notes
